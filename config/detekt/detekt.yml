# #460 governance: thresholds here mirror detekt-anti-slop.yml (see its header).
# #532 parity contract: every rule active in BOTH files carries identical
# effective values (detekt.yml is the single-file IntelliJ plugin entry point,
# so it mirrors the merged Gradle policy). Overlays add activations only.
# backend/.../architecture/DetektConfigParityTest pins the drift set.
# Exclude policy: no new exclude without a `#<ticket>` link; screen-composable
# excludes burn down file-by-file (removal ships with the refactor, never solo).
# #464: custom rules live in :detekt-rules (CompanyApp ruleset, ServiceLoader-registered).
# #465: activation lives in detekt-custom.yml, applied to plugin-bearing modules only
# (a `CompanyApp:` key must NOT be added here: :detekt-rules:detekt itself excludes the
# plugin (self-cycle guard) and config validation would reject the unknown key there).
# Rules activate here per-rule as map #463 lands them.
# #465: SuppressRequiresTicket (custom) activates via detekt-custom.yml;
# ForbiddenSuppress carries the frozen excludes below.
build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    # complexity: 2
    # LongParameterList: 1
    # style: 1
    # comments: 1

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false
  # when writing own rules with new properties, exclude the property path e.g.: 'my_rule_set,.*>.*>[my_property]'
  excludes: ''

processors:
  active: true
  exclude:
    - 'DetektProgressListener'
  # - 'KtFileCountProcessor'
  # - 'PackageCountProcessor'
  # - 'ClassCountProcessor'
  # - 'FunctionCountProcessor'
  # - 'PropertyCountProcessor'
  # - 'ProjectComplexityProcessor'
  # - 'ProjectCognitiveComplexityProcessor'
  # - 'ProjectLLOCProcessor'
  # - 'ProjectCLOCProcessor'
  # - 'ProjectLOCProcessor'
  # - 'ProjectSLOCProcessor'
  # - 'LicenseHeaderLoaderExtension'

console-reports:
  active: true
  exclude:
     - 'ProjectStatisticsReport'
     - 'ComplexityReport'
     - 'NotificationReport'
     - 'FindingsReport'
     - 'FileBasedFindingsReport'
  #  - 'LiteFindingsReport'

output-reports:
  active: true
  exclude:
  # - 'TxtOutputReport'
  # - 'XmlOutputReport'
  # - 'HtmlOutputReport'
  # - 'MdOutputReport'
  # - 'SarifOutputReport'

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: false
    licenseTemplateFile: 'license.template'
    licenseTemplateIsRegex: false
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false
  DeprecatedBlockTag:
    active: false
  EndOfSentenceFormat:
    active: false
    endOfSentenceFormat: '([.?!][ \t\n\r\f<])|([.?!:]$)'
  KDocReferencesNonPublicProperty:
    active: false
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/desktopTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
  OutdatedDocumentation:
    active: false
    matchTypeParameters: true
    matchDeclarationsOrder: true
    allowParamOnConstructorProperties: false
  UndocumentedPublicClass:
    active: false
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/desktopTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
    searchInNestedClass: true
    searchInInnerClass: true
    searchInInnerObject: true
    searchInInnerInterface: true
    searchInProtectedClass: false
    ignoreDefaultCompanionObject: false
  UndocumentedPublicFunction:
    active: false
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/desktopTest/**']
    searchProtectedFunction: false
  UndocumentedPublicProperty:
    active: false
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/desktopTest/**']
    searchProtectedProperty: false

complexity:
  active: true
  CognitiveComplexMethod:
    # #460: enabled at 25 (not 15) with measured justification. Backend logic maxes at
    # 23 (ClientRepository.updateInTransaction) and shared non-UI at 24
    # (DrawerContent.ClockOutSection) — 25 binds both (any +2 growth flags) without
    # mandating a screen-decomposition epic. Declarative @Composables (up to 74 in
    # ClientDetailScreen) are excluded below: UI-tree nesting is not logic complexity,
    # same rationale as the Cyclomatic/LongMethod screen excludes. Threshold mirrored
    # in detekt-anti-slop.yml; excludes live here only (see that file's header).
    # Review trigger (no expiry): revisit when detekt ships composable-aware
    # complexity rules or the screen-decomposition follow-up lands.
    active: true
    threshold: 25
    excludes:
      - '**/ui/screen/**'
      - '**/app/**' #555 app shell composables keep the screen complexity exclusion
      - '**/workforce/**' #563 workforce composables keep the screen complexity exclusion
      - '**/session/**' #573 session composables keep the screen complexity exclusion
      - '**/notification/**' #565 notification composables keep the screen complexity exclusion
      - '**/client/**' #558 client composables keep the screen complexity exclusion
      - '**/finance/**' #559 finance composables keep the screen complexity exclusion
      - '**/commerce/**' #562 commerce composables keep the screen complexity exclusion
      - '**/audit/**' #564 audit composables keep the screen complexity exclusion
  ComplexCondition:
    active: true
    threshold: 4
    excludes:
  ComplexInterface:
    active: true
    threshold: 10
    includeStaticDeclarations: false
    includePrivateDeclarations: false
    ignoreOverloaded: false
    excludes:
      - '**/commonMain/**/session/create/SessionCreateViewModel.kt' #469 SessionCreateFormApi seam kept whole deliberately (see #460 note on TooManyFunctions) #557 retarget (was viewmodel)
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    # #532 decided policy (Phase A freeze): single-when bodies and simple
    # entries don't count — the de-facto enforced standard (Compose leans on
    # when-expressions; e.g. ClientDetailLogic.commitBpDrafts). Pinned by test.
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
    ignoreNestingFunctions: false
    nestingFunctions:
      - 'also'
      - 'apply'
      - 'forEach'
      - 'isNotNull'
      - 'ifNull'
      - 'let'
      - 'run'
      - 'use'
      - 'with'
    excludes:
  LabeledExpression:
    active: false
    ignoredLabels: []
  LargeClass:
    active: true
    threshold: 600
    excludes:
      - '**/commonMain/**/finance/FinanceReportsViewModel.kt' #559 retarget (was viewmodel)
  LongMethod:
    active: true
    threshold: 60
    excludes:
  LongParameterList:
    # #535: design signal, not a mandate for arbitrary DTO wrappers — coherent
    # state-owner and declarative-UI signatures stay whole; bundle only on a real
    # ownership decision (see composeApp/AGENTS.md "State ownership vs file splits").
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: false
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
    excludes:
  MethodOverloading:
    active: true
    threshold: 6
  NamedArguments:
    active: false
    threshold: 3
    # #532 parity: mirrors detekt-anti-slop.yml (inactive in both; value kept identical).
    ignoreArgumentsMatchingNames: true
  NestedBlockDepth:
    active: true
    threshold: 4
  NestedScopeFunctions:
    active: true
    threshold: 1
    functions:
      - 'kotlin.apply'
      - 'kotlin.run'
      - 'kotlin.with'
      - 'kotlin.let'
      - 'kotlin.also'
  ReplaceSafeCallChainWithRun:
    active: false
  StringLiteralDuplication:
    active: false
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/desktopTest/**']
    threshold: 3
    ignoreAnnotation: true
    excludeStringsWithLessThan5Characters: true
    ignoreStringsRegex: '$^'
  TooManyFunctions:
    # #535: retired as a hard gate — a cohesive private implementation stays in its
    # owner instead of being split into extension files or exposing internals to
    # satisfy a function budget. Complexity gates (Cognitive/Cyclomatic/LongMethod,
    # ComplexInterface, MethodOverloading, LargeClass) remain the enforcement.
    active: false
    thresholdInFiles: 11
    thresholdInClasses: 11
    thresholdInInterfaces: 11
    thresholdInObjects: 11
    thresholdInEnums: 11
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: false
    ignoreAnnotatedFunctions: []

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: false
  InjectDispatcher:
    active: true
    dispatcherNames:
      - 'IO'
      - 'Default'
      - 'Unconfined'
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunSwallowedCancellation:
    active: false
  SuspendFunWithCoroutineScopeReceiver:
    active: false
  SuspendFunWithFlowReturnType:
