# Custom-rule activation (#465). Separate file because :detekt-rules:detekt runs
# WITHOUT the plugin on its own classpath (self-cycle guard in build.gradle.kts):
# an unknown top-level key fails config validation there. Applied only to
# plugin-bearing modules; :detekt-rules validates against detekt.yml +
# detekt-anti-slop.yml alone.
CompanyApp:
  SuppressRequiresTicket:
    active: true
  NoAnyInPublicSignature:
    active: true
  NoWeakMapContract:
    active: true
  NoWidenThenCast:
    active: true
    # #467: test harnesses assert types via casts; production scope only.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/desktopTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
  RequireSafetyComment:
    active: true
    # #467: test harnesses assert types via casts; production scope only.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/desktopTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
  NoRuntimeTypeCheck:
    active: true
    # #468 allowlist: api/ boundary owns route param parsing, the JSON mapper
    # owns collection narrowing, named *Parser.kt files own the rest; test
    # harnesses assert types ad hoc.
    # #536: feature-owned HTTP adapters moved with their owners (branch/,
    # branchday/) — same boundary, same narrowing.
    excludes:
      - '**/api/**' # #468
      - '**/branch/BranchRoutes.kt' # #536
      - '**/branchday/BranchDayRoutes.kt' # #536
      - '**/identity/AuthRoutes.kt' # #537
      - '**/identity/MeRoutes.kt' # #537
      - '**/identity/UserRoutes.kt' # #537
      - '**/audit/AuditLogRoutes.kt' # #549
      - '**/client/ClientRoutes.kt' # #541
      - '**/session/SessionRoutes.kt' # #542
      - '**/session/SessionBaseRateRoutes.kt' # #542
      - '**/session/dashboard/DashboardRoutes.kt' # #553
      - '**/commerce/ProductRoutes.kt' # #543
      - '**/commerce/ProductCategoryRoutes.kt' # #543
      - '**/commerce/ProductSaleRoutes.kt' # #543
      - '**/commerce/BranchInventoryRoutes.kt' # #543
      - '**/commission/CommissionRoutes.kt' # #544
      - '**/finance/AllowanceRoutes.kt' # #546
