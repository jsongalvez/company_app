[versions]
bcrypt = "0.10.2"
detekt = "1.23.8"
dotenv = "6.5.1"
exposed = "1.3.1"
flyway = "12.0.3"
flyway-postgresql = "12.0.3"
hikaricp = "7.0.2"
jansi = "2.4.3"
jmh = "1.37"
jmhPlugin = "0.7.3"
jakartaMail = "2.0.2"
javalin = "7.2.2"
javalinOpenapi = "7.2.2"
junit = "4.13.2"
jwt = "4.5.1"
kotlin = "2.3.10"
kotlin-logging = "8.0.01"
kotlin-serialization = "2.3.10"
kotlinx-serialization-json = "1.10.0"
ktlint = "14.1.0"
logback-classic = "1.5.32"
openpdf = "3.0.5"
fastexcel = "0.20.2"
postgresql = "42.7.10"

[libraries]
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt"}
dotenv = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv"}
exposed = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed"}
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed"}
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed"}
flyway = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway-postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp"}
jansi = { module = "org.fusesource.jansi:jansi", version.ref = "jansi"}
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh"}
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh"}
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
javalin-testtools = { module = "io.javalin:javalin-testtools", version.ref = "javalin" }
javalin-openapi-processor = { module = "io.javalin.community.openapi:openapi-annotation-processor", version.ref = "javalinOpenapi" }
javalin-openapi-plugin = { module = "io.javalin.community.openapi:javalin-openapi-plugin", version.ref = "javalinOpenapi" }
javalin-swagger-plugin = { module = "io.javalin.community.openapi:javalin-swagger-plugin", version.ref = "javalinOpenapi" }
detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
detekt-parser = { module = "io.gitlab.arturbosch.detekt:detekt-parser", version.ref = "detekt" }
detekt-test = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }
jakarta-mail = { module = "com.sun.mail:jakarta.mail", version.ref = "jakartaMail" }
jwt = { module = "com.auth0:java-jwt", version.ref = "jwt" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json"}
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback-classic"}
openpdf = { module = "com.github.librepdf:openpdf", version.ref = "openpdf" }
fastexcel = { module = "org.dhatim:fastexcel", version.ref = "fastexcel" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-serialization" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhPlugin" }
