name: browser

# The browser tests (web/tests/*.e2e.ts), split over several machines at once.
# Each machine starts its own Postgres and backend, serving the built web app,
# with the dev seed logins, then runs its slice of the tests.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: company_app
          POSTGRES_USER: company_user
          POSTGRES_PASSWORD: company_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U company_user -d company_app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_PORT: 18080
      WEB_DIR: web/dist
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: company_app
      POSTGRES_USER: company_user
      POSTGRES_PASSWORD: company_password
      TEST_DB_NAME: company_app_test
      JWT_SECRET: ci-secret-must-be-at-least-64-characters-long-for-tests-0123456789
      JWT_ISSUER: company-app-ci
      JWT_AUDIENCE: company-app-ci
      AUTH_DUMMY_PASSWORD: ci-dummy-password
      TEST_USERNAME: owner
      TEST_PASSWORD: owner-dev-pass
      E2E_OWNER_PASSWORD: owner-dev-pass
      SCOPED_USERNAME: staff
      SCOPED_PASSWORD: staff-dev-pass
      RELIEF_USERNAME: relief
      RELIEF_PASSWORD: relief-dev-pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build

      - name: Unit tests for the save queue's pure logic
        working-directory: web
        run: tests/unit/run.sh

      - name: Install the test browser
        working-directory: web
        run: npx @e2e-dev/web install chromium --with-deps

      - name: Start the backend
        run: |
          ./gradlew :backend:classes :backend:devClasses -q
          nohup ./gradlew :backend:run -q > backend.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf localhost:18080/health && exit 0
            sleep 2
          done
          cat backend.log; exit 1

      # A fresh database has no past days; the past-sessions test needs one
      # session on the previous operational day at the fixture branch. The
      # app's business day ends at 4 AM Manila, so between midnight and 4 AM
      # calendar yesterday is still today in the app.
      - name: Seed a past day
        env:
          PGPASSWORD: company_password
        run: |
          psql -h localhost -U company_user -d company_app -v ON_ERROR_STOP=1 <<'SQL'
          WITH c AS (
            INSERT INTO client (first_name, last_name, gender, age)
            VALUES ('Past', 'Dayclient', 'F', 40) RETURNING id
          ), d AS (
            INSERT INTO branch_day (branch_id, date)
            VALUES ('00000000-0000-4000-8000-000000000001',
                    ((now() AT TIME ZONE 'Asia/Manila') - interval '4 hours')::date - 1)
            ON CONFLICT (branch_id, date) DO UPDATE SET date = EXCLUDED.date
            RETURNING id
          )
          INSERT INTO session (client_id, branch_day_id, session_type, is_walk_in, base_price, final_price)
          SELECT c.id, d.id, 'REGULAR', true, 500, 500 FROM c, d;
          SQL

      - name: Run browser tests (slice ${{ matrix.shard }} of 2)
        working-directory: web
        run: npm run e2e -- --shard ${{ matrix.shard }}/2

      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: |
            web/.e2e/results
            backend.log
          retention-days: 7
