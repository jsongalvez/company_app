name: browser

# The browser tests (web/tests/*.e2e.ts), split over several machines at once.
# Each machine starts its own Postgres and backend, serving the built web app,
# with the dev seed logins, then runs its slice of the tests.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "1 of 2", browser: chromium, args: "--shard 1/2" }
          - { name: "2 of 2", browser: chromium, args: "--shard 2/2" }
          # Staff use iPhones and Firefox too: the day without signal runs in Safari's and Firefox's engines, and WebKit plays an iPhone (tests/iphone.e2e.ts).
          - { name: webkit, browser: webkit, args: "tests/roles.setup.e2e.ts tests/offline-day.e2e.ts tests/outbox-model.e2e.ts tests/iphone.e2e.ts tests/offline-hours.e2e.ts" }
          - { name: firefox, browser: firefox, args: "tests/roles.setup.e2e.ts tests/offline-day.e2e.ts tests/outbox-model.e2e.ts tests/offline-hours.e2e.ts" }
    name: e2e (${{ matrix.name }})
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: company_app
          POSTGRES_USER: company_user
          POSTGRES_PASSWORD: company_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U company_user -d company_app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_PORT: 18080
      WEB_DIR: web/dist
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: company_app
      POSTGRES_USER: company_user
      POSTGRES_PASSWORD: company_password
      TEST_DB_NAME: company_app_test
      JWT_SECRET: ci-secret-must-be-at-least-64-characters-long-for-tests-0123456789
      JWT_ISSUER: company-app-ci
      JWT_AUDIENCE: company-app-ci
      AUTH_DUMMY_PASSWORD: ci-dummy-password
      TEST_USERNAME: owner
      TEST_PASSWORD: owner-dev-pass
      E2E_OWNER_PASSWORD: owner-dev-pass
      E2E_BROWSER: ${{ matrix.browser }}
      SCOPED_USERNAME: staff
      SCOPED_PASSWORD: staff-dev-pass
      RELIEF_USERNAME: relief
      RELIEF_PASSWORD: relief-dev-pass
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build

      - name: Unit tests for the save queue's pure logic
        working-directory: web
        run: tests/unit/run.sh

      - name: The web's API types match the server (tools/quality/check-api-types.sh)
        run: tools/quality/check-api-types.sh

      - name: Install the test browser
        working-directory: web
        run: npx @e2e-dev/web install ${{ matrix.browser }} --with-deps

      - name: Start the backend
        run: |
          ./gradlew :backend:classes :backend:devClasses -q
          nohup ./gradlew :backend:run -q > backend.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf localhost:18080/health && exit 0
            sleep 2
          done
          cat backend.log; exit 1

      # A fresh database has no past days and only the dev seed's logins:
      # tools/seed/ adds a past day (past-sessions.e2e.ts) and one user per
      # role with its own branch (roles.e2e.ts). verify.sh loads the same files.
      - name: Seed test data (a past day, one user per role)
        env:
          PGPASSWORD: company_password
        run: |
          for f in tools/seed/*.sql; do psql -h localhost -U company_user -d company_app -v ON_ERROR_STOP=1 -f "$f"; done

      - name: Security headers and hidden API map (tools/verify/headers.sh)
        run: tools/verify/headers.sh http://localhost:18080

      - name: Run browser tests (${{ matrix.name }})
        working-directory: web
        run: npm run e2e -- ${{ matrix.args }}

      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces-${{ matrix.name }}
          path: |
            web/.e2e/results
            backend.log
          retention-days: 7
