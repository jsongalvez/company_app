name: openapi

on:
  push:
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'scripts/check-openapi-spec.sh'
      - 'scripts/normalize-openapi-spec.mjs'
      - 'scripts/openapi-source-parser.mjs'
      - 'scripts/openapi-route-contract.json'
      - 'scripts/verify-openapi-spec.sh'
      - '.github/workflows/openapi.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify OpenAPI contract
        run: bash scripts/check-openapi-spec.sh
