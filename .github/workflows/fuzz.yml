name: fuzz

# Throws random and boundary inputs at every route in the OpenAPI contract, as
# each seeded role and anonymously. Pass = no 5xx and every response matches
# its schema. See tools/fuzz/README.md.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: company_app
          POSTGRES_USER: company_user
          POSTGRES_PASSWORD: company_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U company_user -d company_app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_PORT: 18080
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: company_app
      POSTGRES_USER: company_user
      POSTGRES_PASSWORD: company_password
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: company_user
      PGPASSWORD: company_password
      PGDATABASE: company_app
      JWT_SECRET: ci-secret-must-be-at-least-64-characters-long-for-tests-0123456789
      JWT_ISSUER: company-app-ci
      JWT_AUDIENCE: company-app-ci
      AUTH_DUMMY_PASSWORD: ci-dummy-password
      TEST_USERNAME: owner
      TEST_PASSWORD: owner-dev-pass
      SCOPED_USERNAME: staff
      SCOPED_PASSWORD: staff-dev-pass
      RELIEF_USERNAME: relief
      RELIEF_PASSWORD: relief-dev-pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the fuzzer
        run: pip install schemathesis==4.32.3

      - name: Export the contract and start the backend
        run: |
          ./gradlew :backend:exportOpenApiSpec :backend:classes :backend:devClasses -q
          nohup ./gradlew :backend:run -q > backend.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf localhost:18080/health && exit 0
            sleep 2
          done
          cat backend.log; exit 1

      - name: Fuzz every route
        run: tools/fuzz/run.sh

      - name: Keep the logs of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-logs
          path: |
            build/fuzz
            backend.log
          retention-days: 7
