name: jmh

# JMH benchmark diagnostics — manual `workflow_dispatch` only (#333/#334):
# not an integration gate. Run it when a performance question actually exists;
# ordinary pushes launch nothing and no Wayfinder session waits for or is
# blocked by JMH results. Hosted runs consume the budgeted Actions allowance
# (≤55 min/month), so dispatch only when investigating.
#
# NOTE ON BASELINES: scores in backend/jmh-baselines.md are per-benchmark MEDIANS of
# repeated clean CI runs on this runner (shared-runner CPU lots vary ~1.6x run-to-run;
# never recalibrate from a single run). To re-establish after a runner shift: dispatch
# this workflow several times, extract the "Compare against baseline" scores from each
# log, and write the per-benchmark medians into backend/jmh-baselines.md. After that the
# absolute comparison holds. (check-baselines.sh passes when no baseline exists — first
# run is free.)
#
# A regression failing one run re-runs once and warns; the check fails only
# when the regression reproduces across two runs (runner noise doesn't fail).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jmh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jmh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Run JMH benchmarks
        run: |
          ./gradlew :backend:jmh --no-daemon > /tmp/company-app-jmh.log 2>&1 || {
            tail -50 /tmp/company-app-jmh.log
            exit 1
          }

      - name: Compare against baseline (retry once on noise)
        run: |
          run_compare() {
            local log=$1 out=$2
            bash scripts/check-baselines.sh "$log" > "$out" 2>&1
            local status=$?
            cat "$out"
            return "$status"
          }
          if run_compare /tmp/company-app-jmh.log /tmp/check1.txt; then
            exit 0
          else
            first_status=$?
          fi
          if [ "$first_status" -ne 1 ]; then
            echo "::error title=JMH::Benchmark evidence invalid; regression not evaluated."
            exit 1
          fi
          echo "::warning title=JMH::Possible regression — re-running to confirm"
          run_jmh() {
            local log=$1
            set +e
            set -o pipefail
            ./gradlew :backend:jmh --no-daemon --rerun-tasks 2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              echo "::error title=JMH::Upstream benchmark task failed on retry (Gradle exit $status); regression not evaluated."
            fi
            return "$status"
          }
          if run_jmh /tmp/company-app-jmh-retry.log; then
            :
          else
            retry_status=$?
            echo "::error title=JMH::Benchmark execution failed on retry (Gradle exit $retry_status); regression not evaluated."
            exit 1
          fi
          if run_compare /tmp/company-app-jmh-retry.log /tmp/check2.txt; then
            echo "Regression did not reproduce on retry — noise, passing."
            exit 0
          else
            retry_compare_status=$?
          fi
          if [ "$retry_compare_status" -ne 1 ]; then
            echo "::error title=JMH::Benchmark evidence invalid on retry; regression not evaluated."
            exit 1
          fi
          echo "::error title=JMH::Regression confirmed across two runs. Investigate with JFR, or update backend/jmh-baselines.md if intentional."
          exit 1

      - name: Upload JMH logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-logs
          path: /tmp/company-app-jmh*.log
