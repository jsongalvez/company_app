name: quality

# Asynchronous quality verification (#333): never waited on by the active agent.
# Path-scoped so ordinary docs/handoff pushes launch nothing. Owned shell-tool
# files (tools/quality, tools/performance, scripts) trigger this workflow for
# the lightweight shell-tests job below (#906). OpenAPI
# contract verification runs in the same job to pay checkout/JDK/Gradle setup once.

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'web/src/lib/access.gen.ts'
      - 'detekt-rules/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'config/detekt/**'
      - 'tools/database/**'
      - 'tools/quality/lib/**'
      - 'tools/quality/*.sh'
      - 'tools/check-before-push.sh'
      - 'tools/push.sh'
      - 'docs/patterns.md'
      - 'tools/performance/**'
      - 'tools/feedback/**'
      - 'tools/perf/**'
      - 'scripts/**'
      - 'config/deadcode/**'
      - 'docker/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'web/src/lib/access.gen.ts'
      - 'detekt-rules/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'config/detekt/**'
      - 'tools/database/**'
      - 'tools/quality/lib/**'
      - 'tools/quality/*.sh'
      - 'tools/check-before-push.sh'
      - 'tools/push.sh'
      - 'docs/patterns.md'
      - 'tools/performance/**'
      - 'tools/feedback/**'
      - 'tools/perf/**'
      - 'scripts/**'
      - 'config/deadcode/**'
      - 'docker/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint runs beside the tests, not before them: detekt, ktlint and the dead-code gate
  # need no database, so they stay off the test job's critical path.
  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Dead references (paths, modules, Gradle tasks)
        run: bash tools/quality/check-references.sh --gradle

      - name: Run backend quality lint and detekt-rules checks
        run: >-
          ./gradlew :backend:detekt :backend:ktlintCheck
          :detekt-rules:detekt :detekt-rules:test

      # Semantic dead-code gate (map #529, ref #530; zero-debt Phase C): fails on any
      # finding outside config/deadcode/entry-points.txt, and on stale entries
      # in that file. No DB, no build duplication — the
      # analyzer binds sources directly. Hooks stay untouched (#329).
      - name: Dead-code gate (#530)
        run: ./gradlew deadCodeCheck

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: company_app_test
          POSTGRES_USER: company_user
          POSTGRES_PASSWORD: company_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U company_user -d company_app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_PORT: 8080
      API_BASE_URL: http://localhost:8080
      DB_HOST: localhost
      DB_PORT: 5432
      # POSTGRES_DB names the application database the test guard must never target (#493);
      # it intentionally differs from TEST_DB_NAME. The postgres service provisions
      # company_app_test below; backend workers mint owned test_w_* schemas inside it.
      POSTGRES_DB: company_app
      POSTGRES_USER: company_user
      POSTGRES_PASSWORD: company_password
      TEST_DB_NAME: company_app_test
      JWT_SECRET: ci-secret-must-be-at-least-64-characters-long-for-tests-0123456789
      JWT_ISSUER: company-app-ci
      JWT_AUDIENCE: company-app-ci
      AUTH_DUMMY_PASSWORD: ci-dummy-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      # The test database is thrown away with the runner, so it skips crash-safety writes.
      - name: Enable pg_stat_statements tracking and skip crash-safety writes on the test database (#474)
        run: |
          CONTAINER=$(docker ps -q --filter "ancestor=postgres:18")
          docker exec "$CONTAINER" psql -U company_user -d company_app_test -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements';"
          docker exec "$CONTAINER" psql -U company_user -d company_app_test -c "ALTER SYSTEM SET pg_stat_statements.track = 'all';"
          for setting in "fsync = off" "synchronous_commit = off" "full_page_writes = off"; do
            docker exec "$CONTAINER" psql -U company_user -d company_app_test -c "ALTER SYSTEM SET $setting;"
          done
          docker restart "$CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$CONTAINER" pg_isready -U company_user -d company_app_test >/dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Run backend quality tests
        run: >-
          ./gradlew :backend:test

      # Backend workers use owned test_w_* schemas (#493); public-table cleanliness no
      # longer evidences backend tests. Lifecycle proof lives in WorkerSchemaLifecycleTest.
      # tools/database/check-test-cleanliness.sh stays for k6/manual public-DB cleanup only.

      - name: Verify OpenAPI contract (#495 Gradle gate)
        run: ./gradlew :backend:verifyOpenApiContract

      # Per-test timings, so CI time can be measured class by class.
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/test-results/test/*.xml
          retention-days: 14

  # DB-free shell contract suite (#906): every self-test that run_shell_validation
  # in tools/quality/validate.sh runs locally, wired into async CI so tooling
  # edits verify without author discipline. Ubuntu-only, seconds, no Gradle/DB
  # or network beyond checkout. The live-DB disposable discovery test stays
  # manual. Keep the test list in sync with run_shell_validation.
  shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # check-patterns.sh looks up the "checked at <sha>" commits
          fetch-depth: 0

      - name: Syntax-check owned shell files
        run: |
          for f in tools/check-before-push.sh tools/push.sh tools/quality/*.sh tools/quality/lib/*.sh tools/database/*.sh tools/database/lib/*.sh tools/performance/*.sh tools/perf/*.sh tools/perf/test/*.sh scripts/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done

      - name: Dead references (paths and modules)
        run: bash tools/quality/check-references.sh

      - name: Patterns log rows say whether they still happen
        run: bash tools/quality/check-patterns.sh

      - name: Source files stay under 1000 lines (older big files shrink only)
        run: bash tools/quality/check-file-size.sh

      - name: Server code runs SQL through Exposed's typed tables, not SQL text
        run: bash tools/quality/check-raw-sql.sh

      - name: Role names stay in the policy table (counts elsewhere only go down)
        run: python3 tools/quality/role-names.py

      - name: Comments name no issue, owed-item or message ids
        run: python3 tools/quality/comment-refs.py

      - name: Launch migrations (V1-V4) build what the old chain built
        run: bash tools/database/migration-equivalence.sh

      - name: Run DB-free shell self-tests
        run: |
          bash tools/quality/test-shell-portability.sh
          bash tools/quality/wrapper-contract.test.sh
          bash tools/database/test-db-name-test.sh
          bash tools/database/test-db-discovery-test.sh
          bash tools/database/source-env-test.sh
          bash tools/performance/check-baselines-test.sh
          bash tools/quality/check-before-push-test.sh
          bash tools/quality/check-references-test.sh
          bash tools/quality/check-patterns-test.sh
          bash tools/quality/check-file-size-test.sh
          bash tools/quality/check-raw-sql-test.sh
          bash tools/quality/comment-refs-test.sh
          python3 tools/quality/role-names.py self-test
          bash tools/quality/drop-comment-at-test.sh
          bash tools/quality/push-test.sh
          bash tools/quality/shot-gate-test.sh
          bash tools/quality/replicate-test.sh
          bash tools/quality/unit-timeouts-test.sh
          bash tools/perf/test/record.test.sh
          bash tools/perf/test/alert.test.sh
          bash tools/perf/test/decisions.test.sh
          python3 -I tools/feedback/triage.py self-test
          bash tools/feedback/test/app-feedback-test.sh
          bash tools/feedback/test/app-telemetry-test.sh
