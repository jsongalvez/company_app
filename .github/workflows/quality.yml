name: quality

# Asynchronous quality verification (#333): never waited on by the active agent.
# Path-scoped so ordinary docs/scripts/handoff pushes launch nothing. OpenAPI
# contract verification runs in the same job to pay checkout/JDK/Gradle setup once.

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'composeApp/**'
      - 'shared/**'
      - 'detekt-rules/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'config/detekt/**'
      - '.githooks/**'
      - 'tools/database/**'
      - 'tools/quality/lib/**'
      - 'config/deadcode/**'
      - 'docker/**'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'composeApp/**'
      - 'shared/**'
      - 'detekt-rules/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'config/detekt/**'
      - '.githooks/**'
      - 'tools/database/**'
      - 'tools/quality/lib/**'
      - 'config/deadcode/**'
      - 'docker/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: company_app_test
          POSTGRES_USER: company_user
          POSTGRES_PASSWORD: company_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U company_user -d company_app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_PORT: 8080
      API_BASE_URL: http://localhost:8080
      DB_HOST: localhost
      DB_PORT: 5432
      # POSTGRES_DB names the application database the test guard must never target (#493);
      # it intentionally differs from TEST_DB_NAME. The postgres service provisions
      # company_app_test below; backend workers mint owned test_w_* schemas inside it.
      POSTGRES_DB: company_app
      POSTGRES_USER: company_user
      POSTGRES_PASSWORD: company_password
      TEST_DB_NAME: company_app_test
      JWT_SECRET: ci-secret-must-be-at-least-64-characters-long-for-tests-0123456789
      JWT_ISSUER: company-app-ci
      JWT_AUDIENCE: company-app-ci
      AUTH_DUMMY_PASSWORD: ci-dummy-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable pg_stat_statements tracking on the test database (#474)
        run: |
          CONTAINER=$(docker ps -q --filter "ancestor=postgres:18")
          docker exec "$CONTAINER" psql -U company_user -d company_app_test -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements';"
          docker exec "$CONTAINER" psql -U company_user -d company_app_test -c "ALTER SYSTEM SET pg_stat_statements.track = 'all';"
          docker restart "$CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$CONTAINER" pg_isready -U company_user -d company_app_test >/dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Run backend quality, shared Detekt, shared JVM compilation, and OpenAPI contract
        run: >-
          ./gradlew :backend:detekt :backend:ktlintCheck :backend:test
          :detekt-rules:detekt :detekt-rules:test
          :shared:detektMetadataCommonMain
          :shared:detektJvmMain :shared:detektJvmTest
          :shared:detektAndroidDebug :shared:detektAndroidDebugUnitTest
          :shared:detektIosArm64Main :shared:detektIosArm64Test
          :shared:detektIosSimulatorArm64Main :shared:detektIosSimulatorArm64Test
          :composeApp:detektDesktopTest
          :composeApp:detektAndroidDebugUnitTest
          :composeApp:detektIosArm64Test
          :composeApp:detektIosSimulatorArm64Test
          :composeApp:desktopTest
          :composeApp:detektMetadataCommonMain :composeApp:detektDesktopMain
          :composeApp:detektAndroidDebug :composeApp:detektIosArm64Main
          :composeApp:detektIosSimulatorArm64Main
          :shared:compileKotlinJvm :shared:jvmTest
          -PwarningsAsErrors=true

      # Backend workers use owned test_w_* schemas (#493); public-table cleanliness no
      # longer evidences backend tests. Lifecycle proof lives in WorkerSchemaLifecycleTest.
      # tools/database/check-test-cleanliness.sh stays for k6/manual public-DB cleanup only.

      - name: Verify OpenAPI contract (#495 Gradle gate)
        run: ./gradlew :backend:verifyOpenApiContract -PwarningsAsErrors=true

      # Semantic dead-code gate (map #529, ref #530; zero-debt Phase C): fails on any
      # finding outside config/deadcode/entry-points.txt, and on stale entries
      # in that file. No DB, no build duplication — the
      # analyzer binds sources directly. Hooks stay untouched (#329).
      - name: Dead-code gate (#530)
        run: ./gradlew deadCodeCheck

  compose-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            task: ':composeApp:compileDebugKotlinAndroid'
          - name: Desktop
            task: ':composeApp:compileKotlinDesktop'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Compose ${{ matrix.name }} target
        run: ./gradlew '${{ matrix.task }}'
