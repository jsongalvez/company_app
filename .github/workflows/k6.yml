name: k6

# k6 contract-suite gate (#301): executes every tests/k6 suite against a
# disposable PostgreSQL service and an ephemeral backend boot whenever the
# suites themselves change. helpers.js stays the single metric/threshold
# source of truth — this workflow owns execution and cleanup evidence only.
#
# scripts/run-k6-contract-suites.sh is the single runner: boots the backend
# on the test database with deterministic seed data (DevSeeder), registers an
# ephemeral capability-less user for the authz contract, runs all five suites,
# and restores test-database cleanliness with failure-safe cleanup.

on:
  push:
    branches:
      - master
    paths:
      - 'tests/k6/**'
      - 'scripts/run-k6-contract-suites.sh'
      - 'scripts/clean-test-db.sh'
      - '.github/workflows/k6.yml'
  pull_request:
    paths:
      - 'tests/k6/**'
      - 'scripts/run-k6-contract-suites.sh'
      - 'scripts/clean-test-db.sh'
      - '.github/workflows/k6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6-contract-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: company_app_test
          POSTGRES_USER: company_user
          POSTGRES_PASSWORD: company_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U company_user -d company_app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_PORT: 8080
      API_BASE_URL: http://localhost:8080
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: company_app_test
      POSTGRES_USER: company_user
      POSTGRES_PASSWORD: company_password
      TEST_DB_NAME: company_app_test
      TEST_USERNAME: owner
      TEST_PASSWORD: pass
      LIMITED_USERNAME: limited
      LIMITED_PASSWORD: password
      JWT_SECRET: ci-secret-must-be-at-least-64-characters-long-for-tests-0123456789
      JWT_ISSUER: company-app-ci
      JWT_AUDIENCE: company-app-ci
      AUTH_DUMMY_PASSWORD: ci-dummy-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
      - uses: grafana/setup-k6-action@v1

      - name: Run k6 contract suites against disposable test database
        run: bash scripts/run-k6-contract-suites.sh

      - name: Upload k6 logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k6-logs
          path: |
            /tmp/company-app-k6-boot.log
            /tmp/company-app-k6.log
