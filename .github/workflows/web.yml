name: web

# Static checks for web/: svelte-check (types, a11y warnings) and prettier.
# The browser workflow builds and tests the app; nothing else caught a type
# error or a formatting slip in web/src before this job.

on:
  push:
    branches:
      - master
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Types and warnings (svelte-check)
        run: npm run check

      - name: Formatting (prettier)
        run: npm run lint
